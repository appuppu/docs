<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my42</title>
    <script>
        (function() {
            var l = null;
            try { l = localStorage.getItem('lang'); } catch (e) {}
            if (l !== 'ja' && l !== 'en') {
                l = ((navigator.language || '').toLowerCase().indexOf('ja') === 0) ? 'ja' : 'en';
            }
            document.documentElement.lang = l;
        })();
        function setLang(l) {
            try { localStorage.setItem('lang', l); } catch (e) {}
            document.documentElement.lang = l;
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 14px;
        }

        .username {
            font-weight: bold;
            color: #667eea;
        }

        html[lang="ja"] [data-lang="en"] { display: none !important; }
        html[lang="en"] [data-lang="ja"] { display: none !important; }
        .lang-switch {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }
        .lang-switch button {
            padding: 6px 12px;
            border: none;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            cursor: pointer;
        }
        html[lang="ja"] .lang-switch #btn-ja,
        html[lang="en"] .lang-switch #btn-en {
            background: #fff;
            color: #333;
            font-weight: 600;
        }
    </style>
    <script>
        // URLからユーザー名を取得
        function getUsername() {
            const path = window.location.pathname;
            const parts = path.split('/').filter(p => p);
            // 末尾のセグメントをユーザー名として扱う（"profile"やindex.html自体は除外）
            const last = parts[parts.length - 1] || '';
            if (last && last !== 'profile' && last.indexOf('.html') === -1) return last;
            return document.documentElement.lang === 'ja' ? 'ユーザー' : 'this user';
        }

        function checkAppInstallation() {
            const username = getUsername();
            document.querySelectorAll('.username').forEach(function(el) {
                el.textContent = username;
            });
        }

        window.onload = checkAppInstallation;
    </script>
</head>
<body>
    <div class="lang-switch">
        <button id="btn-ja" onclick="setLang('ja')">日本語</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <div data-lang="ja">
        <div class="container">
            <div class="icon">🎵</div>
            <h1>my42</h1>
            <p class="subtitle">おすすめの音楽を紹介しよう</p>

            <p class="message">
                <span class="username"></span> さんのプロフィールを見るには、<br>
                my42アプリが必要です。
            </p>

            <a href="https://apps.apple.com/jp/app/id6754846506" class="download-btn">
                App Storeからダウンロード
            </a>

            <div class="footer">
                アプリをインストールすると、<br>
                このリンクから直接プロフィールが開けるようになります
            </div>
        </div>
    </div>

    <div data-lang="en">
        <div class="container">
            <div class="icon">🎵</div>
            <h1>my42</h1>
            <p class="subtitle">Share your favorite music</p>

            <p class="message">
                To see <span class="username"></span>'s profile,<br>
                you need the my42 app.
            </p>

            <a href="https://apps.apple.com/app/id6754846506" class="download-btn">
                Download on the App Store
            </a>

            <div class="footer">
                Once you install the app,<br>
                this link will open the profile directly
            </div>
        </div>
    </div>
</body>
</html>
