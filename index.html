<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my42</title>
    <script>
        (function() {
            var l = null;
            try { l = localStorage.getItem('lang'); } catch (e) {}
            if (l !== 'ja' && l !== 'en') {
                l = ((navigator.language || '').toLowerCase().indexOf('ja') === 0) ? 'ja' : 'en';
            }
            document.documentElement.lang = l;
        })();
        function setLang(l) {
            try { localStorage.setItem('lang', l); } catch (e) {}
            document.documentElement.lang = l;
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #ff9966, #ff5e62, #000);
            min-height: 100vh;
            color: white;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        a {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            text-align: center;
            transition: background 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        html[lang="ja"] [data-lang="en"] { display: none !important; }
        html[lang="en"] [data-lang="ja"] { display: none !important; }
        .lang-switch {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }
        .lang-switch button {
            padding: 6px 12px;
            border: none;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            cursor: pointer;
        }
        html[lang="ja"] .lang-switch #btn-ja,
        html[lang="en"] .lang-switch #btn-en {
            background: #fff;
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button id="btn-ja" onclick="setLang('ja')">日本語</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <div data-lang="ja">
        <h1>my42</h1>
        <p>音楽を通じて繋がる、新しい音楽紹介アプリ</p>

        <div class="links">
            <a href="privacy.html">プライバシーポリシー</a>
            <a href="terms.html">利用規約</a>
            <a href="support.html">サポート</a>
        </div>
    </div>

    <div data-lang="en">
        <h1>my42</h1>
        <p>A new music-sharing app that connects people through music</p>

        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="support.html">Support</a>
        </div>
    </div>
</body>
</html>
